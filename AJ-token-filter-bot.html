<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AJ Token Filter Bot</title>
<style>
:root{--bg:#0b0b0e;--card:#16171b;--card2:#101114;--line:#2a2c33;--txt:#f2f2f2;--mut:#8a8d96;--acc:#ffec4a;--ok:#3ddc84;--bad:#ff5c5c;--warn:#ffb020}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header h1{font-size:16px;margin:0;flex:1}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--card);color:var(--txt)}
button.pri{background:var(--acc);color:#000;font-weight:700}
button.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.wrap{padding:12px 14px;max-width:900px;margin:auto}
details{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px}
summary{font-weight:600;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.f label{display:block;color:var(--mut);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.rng{display:flex;gap:6px;align-items:center}
input[type=number],select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font:inherit}
input:disabled{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);padding:7px 10px;border-radius:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.status{color:var(--mut);font-size:12px;margin:6px 2px 12px}
.tok{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid transparent}
.tok.new{border-color:var(--acc)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.sym{font-weight:700;font-size:15px}
.nm{color:var(--mut);font-size:12px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:10px;padding:2px 7px;border-radius:20px;background:#26272d;color:var(--mut);margin-left:6px}
.badge.new{background:var(--acc);color:#000;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.s span{display:block;color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.s b{font-size:13px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.deep{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{font-size:11px;padding:3px 8px;border-radius:8px;background:var(--card2);border:1px solid var(--line)}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}.tag.warn{color:var(--warn)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{font-size:12px;color:var(--txt);text-decoration:none;background:var(--card2);border:1px solid var(--line);padding:5px 9px;border-radius:9px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.note{font-size:12px;color:var(--mut);margin-top:10px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px}
.bar button{flex:1}
.na{opacity:.45}
</style>
</head>
<body>
<header>
  <h1>AJ Token Filter Bot</h1>
  <span id="live" class="badge">idle</span>
</header>

<div class="wrap">
<details id="filters">
  <summary>Filters ▾ (tap to open)</summary>

  <div class="row">
    <button class="sm" data-preset="newbie">Beginner (default)</button>
    <button class="sm" data-preset="mine">My old</button>
    <button class="sm" data-preset="loose">Loose</button>
    <button class="sm" data-preset="balanced">Balanced</button>
    <button class="sm" data-preset="safe">Safe</button>
  </div>

  <div class="chips" id="protos">
    <label class="chip"><input type="checkbox" value="pump" checked> Pump.fun</label>
    <label class="chip"><input type="checkbox" value="moonshot"> Moonshot</label>
    <label class="chip"><input type="checkbox" value="meteora"> Meteora</label>
    <label class="chip"><input type="checkbox" value="raydium" checked> Raydium</label>
  </div>

  <div class="grid" id="grid"></div>

  <div class="row">
    <label class="chip"><input type="checkbox" id="deep" checked> Deep check (holders, insiders, dev) via RugCheck</label>
    <label class="chip"><input type="checkbox" id="strict" checked> Hide tokens with unknown holder data</label>
  </div>
  <p class="note">Beginner preset: tokens 1h to 24h old, real liquidity and volume, spread-out holders, low insider and dev share. If you see nothing, tap Loose or lower the minimums. Sniper and bundler data isn't available on free APIs.</p>
</details>

<div class="status" id="status">Press Scan to start.</div>
<div id="list"></div>
</div>

<div class="bar">
  <select id="auto" style="flex:0 0 110px">
    <option value="0">Auto: off</option>
    <option value="30">Auto: 30s</option>
    <option value="60" selected>Auto: 60s</option>
    <option value="120">Auto: 2m</option>
  </select>
  <select id="sort" style="flex:0 0 120px">
    <option value="age">Newest</option>
    <option value="vol">Volume</option>
    <option value="mcap">Mkt cap</option>
    <option value="liq">Liquidity</option>
    <option value="txns">Txns</option>
  </select>
  <button class="pri" id="scan">Scan</button>
</div>

<script>
const FIELDS=[
 ['age','Age (min)'],['mcap','Market cap ($)'],['vol','24h volume ($)'],['liq','Liquidity ($)'],
 ['txns','24h transactions'],['holders','Holders'],['top10','Top 10 holders (%)'],
 ['insider','Insider (%)'],['dev','Developer (%)']
];
const PRESETS={
 newbie:{age:[60,1440],mcap:[25000,''],liq:[10000,''],vol:[25000,''],txns:[300,''],holders:[200,''],top10:['',35],insider:['',5],dev:['',5]},
 mine:{mcap:[1000,''],liq:[1000,''],top10:['',100],insider:['',5],dev:['',15]},
 loose:{mcap:[5000,''],liq:[3000,''],vol:[5000,''],top10:['',50],insider:['',15],dev:['',15]},
 balanced:{age:[10,120],mcap:[10000,''],liq:[5000,''],vol:[10000,''],txns:[150,''],holders:[100,''],top10:['',35],insider:['',10],dev:['',10]},
 safe:{age:[30,720],mcap:[25000,''],liq:[10000,''],vol:[25000,''],txns:[300,''],holders:[200,''],top10:['',30],insider:['',5],dev:['',5]}
};
const DEEP_KEYS=['holders','top10','insider','dev'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{if(n==null||isNaN(n))return'–';const a=Math.abs(n);return a>=1e9?(n/1e9).toFixed(2)+'B':a>=1e6?(n/1e6).toFixed(2)+'M':a>=1e3?(n/1e3).toFixed(1)+'K':n.toFixed(0)};
const pct=n=>n==null?'–':n.toFixed(1)+'%';
const ageStr=m=>m<60?Math.round(m)+'m':m<1440?(m/60).toFixed(1)+'h':(m/1440).toFixed(1)+'d';

// ---------- build filter inputs ----------
$('#grid').innerHTML=FIELDS.map(([k,l])=>`<div class="f"><label>${l}</label><div class="rng"><input type="number" inputmode="decimal" id="${k}-min" placeholder="min"><span>-</span><input type="number" inputmode="decimal" id="${k}-max" placeholder="max"></div></div>`).join('');

function setPreset(name){
  const p=PRESETS[name]||{};
  FIELDS.forEach(([k])=>{const v=p[k]||['',''];$(`#${k}-min`).value=v[0];$(`#${k}-max`).value=v[1]});
  save();
}
function readCfg(){
  const c={protos:[...document.querySelectorAll('#protos input:checked')].map(i=>i.value),deep:$('#deep').checked,strict:$('#strict').checked,f:{}};
  FIELDS.forEach(([k])=>{const a=$(`#${k}-min`).value,b=$(`#${k}-max`).value;c.f[k]=[a===''?null:+a,b===''?null:+b]});
  return c;
}
function save(){try{localStorage.setItem('ajtfb2',JSON.stringify(readCfg()))}catch(e){}}
function load(){
  try{
    const c=JSON.parse(localStorage.getItem('ajtfb2'));
    if(!c){setPreset('newbie');return}
    document.querySelectorAll('#protos input').forEach(i=>i.checked=c.protos.includes(i.value));
    $('#deep').checked=c.deep;$('#strict').checked=c.strict;
    FIELDS.forEach(([k])=>{const v=c.f[k]||[null,null];$(`#${k}-min`).value=v[0]??'';$(`#${k}-max`).value=v[1]??''});
  }catch(e){setPreset('newbie')}
}
document.addEventListener('input',save);
document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>setPreset(b.dataset.preset));
load();

// ---------- data ----------
const DEX='https://api.dexscreener.com';
const RC='https://api.rugcheck.xyz/v1/tokens/';
const deepCache=new Map();
const seen=new Set();
let results=[];let timer=null;let busy=false;

async function jget(url){const r=await fetch(url);if(!r.ok)throw new Error(r.status);return r.json()}
function protoOf(dexId){
  dexId=(dexId||'').toLowerCase();
  if(dexId==='pumpfun'||dexId==='pumpswap')return'pump';
  if(dexId==='moonshot')return'moonshot';
  if(dexId==='meteora')return'meteora';
  if(dexId==='raydium')return'raydium';
  return'other';
}
function pairToTok(p){
  const now=Date.now();
  const t=p.txns?.h24||{};
  return{
    mint:p.baseToken?.address,sym:p.baseToken?.symbol,name:p.baseToken?.name,
    dex:p.dexId,proto:protoOf(p.dexId),pair:p.pairAddress,
    price:+p.priceUsd,mcap:p.marketCap??p.fdv,liq:p.liquidity?.usd,vol:p.volume?.h24,
    txns:(t.buys||0)+(t.sells||0),buys:t.buys||0,sells:t.sells||0,
    age:p.pairCreatedAt?(now-p.pairCreatedAt)/60000:null,
    ch1:p.priceChange?.h1,ch24:p.priceChange?.h24
  };
}
async function fetchCandidates(){
  const urls=[DEX+'/token-profiles/latest/v1',DEX+'/token-boosts/latest/v1',DEX+'/token-boosts/top/v1'];
  const addrs=new Set();
  const lists=await Promise.allSettled(urls.map(jget));
  lists.forEach(r=>{if(r.status==='fulfilled'&&Array.isArray(r.value))r.value.forEach(x=>{if(x.chainId==='solana'&&x.tokenAddress)addrs.add(x.tokenAddress)})});
  const pairs=[];
  const arr=[...addrs];
  for(let i=0;i<arr.length;i+=30){
    try{const d=await jget(`${DEX}/tokens/v1/solana/${arr.slice(i,i+30).join(',')}`);if(Array.isArray(d))pairs.push(...d)}catch(e){}
  }
  for(const q of['pumpfun','pumpswap','raydium new','meteora']){
    try{const d=await jget(`${DEX}/latest/dex/search?q=${encodeURIComponent(q)}`);(d.pairs||[]).filter(p=>p.chainId==='solana').forEach(p=>pairs.push(p))}catch(e){}
  }
  // best pair (highest liquidity) per mint
  const best=new Map();
  pairs.forEach(p=>{
    if(p.chainId!=='solana'||!p.baseToken?.address)return;
    const k=p.baseToken.address;const cur=best.get(k);
    if(!cur||(p.liquidity?.usd||0)>(cur.liquidity?.usd||0))best.set(k,p);
  });
  return[...best.values()].map(pairToTok);
}

// ---------- deep check (RugCheck) ----------
async function deepCheck(mint){
  const c=deepCache.get(mint);
  if(c&&Date.now()-c.t<5*60000)return c.d;
  let d={ok:false};
  try{
    const r=await jget(RC+mint+'/report');
    const lp=new Set();
    (r.markets||[]).forEach(m=>{[m.pubkey,m.liquidityA,m.liquidityB,m.lp?.lpLockedAddress].forEach(a=>a&&lp.add(a))});
    const holders=(r.topHolders||[]).filter(h=>!lp.has(h.address)&&!lp.has(h.owner));
    const top10=holders.slice(0,10).reduce((s,h)=>s+(h.pct||0),0);
    const insider=holders.filter(h=>h.insider).reduce((s,h)=>s+(h.pct||0),0);
    let dev=null;
    if(r.creator){const h=(r.topHolders||[]).find(h=>h.owner===r.creator||h.address===r.creator);dev=h?(h.pct||0):0}
    if(dev==null&&r.creatorBalance!=null&&r.token?.supply)dev=r.creatorBalance/r.token.supply*100;
    const risks=(r.risks||[]).filter(x=>x.level==='danger'||x.level==='warn').map(x=>({n:x.name,l:x.level}));
    d={ok:true,holders:r.totalHolders??null,top10,insider,dev,sniper:null,bundler:null,rugged:!!r.rugged,risks};
  }catch(e){}
  deepCache.set(mint,{t:Date.now(),d});
  return d;
}
async function pool(items,n,fn){
  let i=0;const w=Array.from({length:n},async()=>{while(i<items.length){const x=items[i++];await fn(x)}});
  await Promise.all(w);
}

// ---------- filtering ----------
const inR=(v,[a,b])=>{if(a==null&&b==null)return true;if(v==null)return null;return(a==null||v>=a)&&(b==null||v<=b)};
function basicPass(t,c){
  if(!c.protos.includes(t.proto))return false;
  const f=c.f;
  const m={age:t.age,mcap:t.mcap,vol:t.vol,liq:t.liq,txns:t.txns};
  for(const k in m){const r=inR(m[k],f[k]);if(r===false||r===null)return false}
  return true;
}
function deepPass(t,d,c){
  const f=c.f;
  if(!d||!d.ok){
    const wants=DEEP_KEYS.some(k=>f[k][0]!=null||f[k][1]!=null);
    return !(wants&&c.strict);
  }
  if(d.rugged)return false;
  for(const k of['holders','top10','insider','dev']){
    const r=inR(d[k],f[k]);if(r===false)return false;
  }
  return true;
}

// ---------- scan ----------
async function scan(){
  if(busy)return;busy=true;
  const btn=$('#scan');btn.textContent='Scanning…';$('#live').textContent='scanning';
  const c=readCfg();
  try{
    $('#status').textContent='Fetching tokens…';
    const toks=await fetchCandidates();
    let pass=toks.filter(t=>basicPass(t,c));
    const total=toks.length;
    if(c.deep){
      const need=pass.slice(0,40);
      let n=0;
      $('#status').textContent=`${total} tokens, ${pass.length} passed basic filters. Deep checking…`;
      await pool(need,3,async t=>{t.deep=await deepCheck(t.mint);n++;$('#status').textContent=`Deep check ${n}/${need.length}…`});
      pass=need.filter(t=>deepPass(t,t.deep,c));
    }
    pass.forEach(t=>{t.isNew=!seen.has(t.mint)});
    const fresh=pass.filter(t=>t.isNew).length;
    results=pass;
    render();
    pass.forEach(t=>seen.add(t.mint));
    $('#status').textContent=`${total} scanned, ${pass.length} match. Updated ${new Date().toLocaleTimeString()}`;
    if(fresh&&seen.size>fresh)beep();
  }catch(e){
    $('#status').textContent='Scan failed: '+e.message+'. Check your connection and try again.';
  }
  btn.textContent='Scan';$('#live').textContent=timer?'auto':'idle';busy=false;
}
function beep(){
  try{const a=new(window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator();const g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(a.currentTime+.15)}catch(e){}
}

// ---------- render ----------
function render(){
  const s=$('#sort').value;
  const arr=[...results];
  if(s==='age')arr.sort((a,b)=>(a.age??1e9)-(b.age??1e9));
  else arr.sort((a,b)=>(b[s]||0)-(a[s]||0));
  if(!arr.length){$('#list').innerHTML='<div class="empty">No tokens match. Loosen insider/dev caps or lower the volume and liquidity minimums.</div>';return}
  $('#list').innerHTML=arr.map(t=>{
    const d=t.deep;
    const tag=(label,val,bad)=>`<span class="tag ${val==null?'':bad?'bad':'ok'}">${label} ${val==null?'n/a':pct(val)}</span>`;
    const c=readCfg().f;
    const over=(k,v)=>c[k][1]!=null&&v!=null&&v>c[k][1];
    const deepHtml=d&&d.ok?`<div class="deep">
      <span class="tag">Holders ${d.holders??'n/a'}</span>
      ${tag('Top10',d.top10,over('top10',d.top10))}
      ${tag('Insider',d.insider,over('insider',d.insider))}
      ${tag('Dev',d.dev,over('dev',d.dev))}
      ${d.risks.slice(0,2).map(r=>`<span class="tag ${r.l==='danger'?'bad':'warn'}">${esc(r.n)}</span>`).join('')}
    </div>`:(d?'<div class="deep"><span class="tag warn">Holder data unavailable</span></div>':'');
    const ch=(v)=>v==null?'–':`<span class="${v>=0?'up':'dn'}">${v>=0?'+':''}${v}%</span>`;
    return`<div class="tok ${t.isNew?'new':''}">
      <div class="top"><div><div class="sym">${esc(t.sym)}${t.isNew?'<span class="badge new">NEW</span>':''}<span class="badge">${esc(t.dex)}</span></div><div class="nm">${esc(t.name)}</div></div>
      <div style="text-align:right"><div class="sym">${t.price?'$'+(t.price<0.0001?t.price.toExponential(2):t.price.toPrecision(4)):'–'}</div><div class="nm">1h ${ch(t.ch1)} · 24h ${ch(t.ch24)}</div></div></div>
      <div class="stats">
        <div class="s"><span>Mkt cap</span><b>$${fmt(t.mcap)}</b></div>
        <div class="s"><span>Liquidity</span><b>$${fmt(t.liq)}</b></div>
        <div class="s"><span>24h vol</span><b>$${fmt(t.vol)}</b></div>
        <div class="s"><span>Age</span><b>${t.age==null?'–':ageStr(t.age)}</b></div>
        <div class="s"><span>Txns</span><b>${t.txns} <small class="up">${t.buys}</small>/<small class="dn">${t.sells}</small></b></div>
        <div class="s"><span>Liq/MC</span><b>${t.mcap&&t.liq?(t.liq/t.mcap*100).toFixed(0)+'%':'–'}</b></div>
      </div>
      ${deepHtml}
      <div class="links">
        <a target="_blank" rel="noopener" href="https://dexscreener.com/solana/${esc(t.pair)}">DexScreener</a>
        <a target="_blank" rel="noopener" href="https://rugcheck.xyz/tokens/${esc(t.mint)}">RugCheck</a>
        <a target="_blank" rel="noopener" href="https://solscan.io/token/${esc(t.mint)}">Solscan</a>
        <a href="#" data-copy="${esc(t.mint)}">Copy CA</a>
      </div></div>`}).join('');
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-copy]');
  if(a){e.preventDefault();navigator.clipboard?.writeText(a.dataset.copy);a.textContent='Copied';setTimeout(()=>a.textContent='Copy CA',1200)}
});
$('#sort').onchange=render;
$('#scan').onclick=()=>{$('#filters').open=false;scan()};
function setAuto(){
  clearInterval(timer);timer=null;
  const s=+$('#auto').value;
  if(s){timer=setInterval(scan,s*1000);$('#live').textContent='auto'}else $('#live').textContent='idle';
}
$('#auto').onchange=setAuto;
setAuto();
</script>
</body>
</html>
